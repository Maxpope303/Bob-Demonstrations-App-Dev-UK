# =============================================================================
# Energy Grid Backend — Quarkus Configuration
# Migrated from Spring Boot 2.7.0 → Quarkus 3.15.1 (Spring Compatibility)
# =============================================================================

# HTTP
quarkus.http.port=8080

# Health endpoint (replaces Spring Actuator /actuator/health → /q/health)
quarkus.smallrye-health.ui.always-include=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.electrify".level=DEBUG

# =============================================================================
# Datasource (JPA) — use %prod. prefix so Dev Services can provision in dev/test
# Uncomment and fill in production values:
# %prod.quarkus.datasource.db-kind=postgresql
# %prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/energygrid
# %prod.quarkus.datasource.username=energygrid
# %prod.quarkus.datasource.password=changeme
# quarkus.hibernate-orm.database.generation=update
# =============================================================================

# =============================================================================
# MongoDB — use %prod. prefix so Dev Services can provision in dev/test
# Uncomment and fill in production values:
# %prod.quarkus.mongodb.connection-string=mongodb://localhost:27017/energygrid
# =============================================================================

# =============================================================================
# Security
# DISCREPANCY #10-13: Basic HTTP auth preserved from Spring implementation.
# Design specifies Auth0 / OAuth2 / OIDC (Authorization Code Flow with PKCE).
# To wire Auth0, replace quarkus-spring-security with quarkus-oidc and set:
# quarkus.oidc.auth-server-url=https://<your-domain>.auth0.com/
# quarkus.oidc.client-id=<client-id>
# quarkus.oidc.credentials.secret=<client-secret>
# quarkus.oidc.application-type=web-app
# =============================================================================
